<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact — Alice Garden Restaurant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&amp;display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;900&amp;display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&amp;display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .font-playfair {
            font-family: 'Playfair Display', serif !important;
        }
        .font-montserrat {
            font-family: 'Montserrat', sans-serif !important;
        }
        
        /* Dynamic Island Navbar */
        .nav-island {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50px;
            padding: 12px 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            max-width: 90%;
        }
        .nav-island.scrolled {
            top: 10px;
            padding: 10px 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        }
        .nav-link {
            position: relative;
            transition: all 0.3s ease;
        }
        .nav-link::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 50%;
            transform: translateX(-50%) scaleX(0);
            width: 100%;
            height: 2px;
            background: #e11d48;
            transition: transform 0.3s ease;
        }
        .nav-link:hover::after {
            transform: translateX(-50%) scaleX(1);
        }
        .fade-in-up {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.6s ease-out, transform 0.6s ease-out;
        }
        .fade-in-up.visible {
            opacity: 1;
            transform: translateY(0);
        }
        .hover-lift {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s ease;
        }
        .hover-lift:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
        }
        .hover-glow {
            transition: box-shadow 0.3s ease;
        }
        .hover-glow:hover {
            box-shadow: 0 0 30px rgba(225, 29, 72, 0.3);
        }
        .hover-scale {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .hover-scale:hover {
            transform: scale(1.05);
        }
        html {
            scroll-behavior: smooth;
        }
    </style>
</head>

<body class="antialiased text-rose-950 bg-rose-50/30" style="font-family: Inter, ui-sans-serif, system-ui;">

    <!-- Dynamic Island Navigation -->
    <nav id="navIsland" class="nav-island">
        <div class="flex items-center gap-6">
            <div class="text-xl font-playfair font-bold tracking-tight cursor-pointer text-rose-600 hover:text-rose-700 transition-colors hover-scale" onclick="window.location.href='index.html'" role="button">Alice Garden</div>
            <div class="hidden md:flex items-center gap-6">
                <a href="index.html" class="nav-link text-sm font-medium text-neutral-700 hover:text-rose-600 transition-colors">Home</a>
                <a href="about.html" class="nav-link text-sm font-medium text-neutral-700 hover:text-rose-600 transition-colors">About</a>
                <a href="services.html" class="nav-link text-sm font-medium text-neutral-700 hover:text-rose-600 transition-colors">Services</a>
                <a href="portfolio.html" class="nav-link text-sm font-medium text-neutral-700 hover:text-rose-600 transition-colors">Gallery</a>
                <a href="contact.html" class="nav-link text-sm font-medium text-rose-600 transition-colors">Contact</a>
            </div>
            <button onclick="window.location.href='contact.html'" class="bg-rose-600 text-white px-5 py-2 rounded-full text-sm font-medium hover:bg-rose-700 transition-all duration-300 shadow-lg shadow-rose-200 hover:shadow-xl hover:shadow-rose-300 hover-scale">
                Book a Table
            </button>
            <button id="mobileMenuBtn" class="md:hidden text-neutral-700 hover:text-rose-600 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="4" y1="12" x2="20" y2="12"></line>
                    <line x1="4" y1="6" x2="20" y2="6"></line>
                    <line x1="4" y1="18" x2="20" y2="18"></line>
                </svg>
            </button>
        </div>
        <div id="mobileMenu" class="hidden md:hidden mt-4 pt-4 border-t border-rose-100">
            <div class="flex flex-col gap-3">
                <a href="index.html" class="nav-link text-sm font-medium text-neutral-700 hover:text-rose-600 transition-colors py-2">Home</a>
                <a href="about.html" class="nav-link text-sm font-medium text-neutral-700 hover:text-rose-600 transition-colors py-2">About</a>
                <a href="services.html" class="nav-link text-sm font-medium text-neutral-700 hover:text-rose-600 transition-colors py-2">Services</a>
                <a href="portfolio.html" class="nav-link text-sm font-medium text-neutral-700 hover:text-rose-600 transition-colors py-2">Gallery</a>
                <a href="contact.html" class="nav-link text-sm font-medium text-rose-600 transition-colors py-2">Contact</a>
            </div>
        </div>
    </nav>

    <main class="pt-40 pb-20">
        <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="text-center mb-16 fade-in-up">
                <h1 class="text-5xl md:text-7xl font-playfair font-bold text-rose-950 mb-6">Contact Us</h1>
                <p class="text-xl text-neutral-600 max-w-3xl mx-auto">
                    We'd love to hear from you.
                </p>
            </div>

            <div class="grid lg:grid-cols-2 gap-12">
                <!-- Contact Info -->
                <div class="space-y-8 fade-in-up">
                    <div class="bg-white p-8 rounded-[32px] shadow-lg border border-rose-100 hover-lift hover-glow">
                        <h3 class="text-2xl font-playfair font-bold text-rose-900 mb-6">Visit Us</h3>
                        <div class="space-y-4">
                            <div class="flex items-start gap-4">
                                <div class="bg-rose-100 p-3 rounded-full text-rose-600">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                        stroke-linejoin="round">
                                        <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z" />
                                        <circle cx="12" cy="10" r="3" />
                                    </svg>
                                </div>
                                <div>
                                    <h4 class="font-bold text-rose-900">Address</h4>
                                    <p class="text-neutral-600">57 Oduduwa Way, Ikeja GRA, Lagos, Nigeria</p>
                                </div>
                            </div>
                            <div class="flex items-start gap-4">
                                <div class="bg-rose-100 p-3 rounded-full text-rose-600">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                        stroke-linejoin="round">
                                        <circle cx="12" cy="12" r="10" />
                                        <polyline points="12 6 12 12 16 14" />
                                    </svg>
                                </div>
                                <div>
                                    <h4 class="font-bold text-rose-900">Hours</h4>
                                    <p class="text-neutral-600">Daily: 11:00 AM – 10:00 PM</p>
                                </div>
                            </div>
                            <div class="flex items-start gap-4">
                                <div class="bg-rose-100 p-3 rounded-full text-rose-600">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                        stroke-linejoin="round">
                                        <path
                                            d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z" />
                                    </svg>
                                </div>
                                <div>
                                    <h4 class="font-bold text-rose-900">Phone</h4>
                                    <p class="text-neutral-600">+234 810 000 0000</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Contact Form -->
                <div class="bg-white p-8 rounded-[32px] shadow-lg border border-rose-100 fade-in-up hover-lift" style="transition-delay: 0.2s;">
                    <h3 class="text-2xl font-playfair font-bold text-rose-900 mb-6">Send a Message</h3>
                    <form action="mailto:hello@crownect.com" method="POST" enctype="text/plain" class="space-y-6">
                        <div>
                            <label for="name" class="block text-sm font-medium text-neutral-700 mb-1">Full Name</label>
                            <input type="text" id="name" name="name" required
                                class="w-full px-4 py-3 rounded-xl border border-rose-200 focus:border-rose-500 focus:ring-2 focus:ring-rose-200 outline-none transition-all">
                        </div>
                        <div>
                            <label for="phone" class="block text-sm font-medium text-neutral-700 mb-1">Phone
                                Number</label>
                            <input type="tel" id="phone" name="phone" required
                                class="w-full px-4 py-3 rounded-xl border border-rose-200 focus:border-rose-500 focus:ring-2 focus:ring-rose-200 outline-none transition-all">
                        </div>
                        <div>
                            <label for="email" class="block text-sm font-medium text-neutral-700 mb-1">Email</label>
                            <input type="email" id="email" name="email" required
                                class="w-full px-4 py-3 rounded-xl border border-rose-200 focus:border-rose-500 focus:ring-2 focus:ring-rose-200 outline-none transition-all">
                        </div>
                        <div>
                            <label for="message" class="block text-sm font-medium text-neutral-700 mb-1">Message</label>
                            <textarea id="message" name="message" rows="4" required
                                class="w-full px-4 py-3 rounded-xl border border-rose-200 focus:border-rose-500 focus:ring-2 focus:ring-rose-200 outline-none transition-all"></textarea>
                        </div>
                        <button type="submit"
                            class="w-full bg-rose-600 text-white font-bold py-4 rounded-xl hover:bg-rose-700 transition-all duration-300 shadow-lg shadow-rose-200 hover:shadow-xl hover:shadow-rose-300 hover-scale">
                            Send Message
                        </button>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <footer class="sm:px-6 lg:px-8 max-w-7xl mx-auto px-4 pb-8">
        <div class="border-t border-rose-200 pt-8 flex flex-col sm:flex-row justify-between items-center gap-4">
            <p class="text-neutral-600 text-sm">© 2025 Alice Garden Restaurant.</p>
        </div>
    </footer>
    
    <script>
        // Dynamic Island Navbar Scroll Effect
        const navIsland = document.getElementById('navIsland');
        
        window.addEventListener('scroll', () => {
            const currentScroll = window.pageYOffset;
            
            if (currentScroll > 50) {
                navIsland.classList.add('scrolled');
            } else {
                navIsland.classList.remove('scrolled');
            }
        });
        
        // Mobile Menu Toggle
        const mobileMenuBtn = document.getElementById('mobileMenuBtn');
        const mobileMenu = document.getElementById('mobileMenu');
        
        if (mobileMenuBtn) {
            mobileMenuBtn.addEventListener('click', () => {
                mobileMenu.classList.toggle('hidden');
            });
        }
        
        // Scroll Animation Observer
        const observerOptions = {
            threshold: 0.1,
            rootMargin: '0px 0px -50px 0px'
        };
        
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                }
            });
        }, observerOptions);
        
        // Observe all animated elements
        document.addEventListener('DOMContentLoaded', () => {
            const animatedElements = document.querySelectorAll('.fade-in-up');
            animatedElements.forEach(el => observer.observe(el));
        });
    </script>
</body>

</html>
